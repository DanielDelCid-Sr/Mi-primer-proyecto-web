
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombilla</title>
</head>

<body>

    <h1>Control de Bombilla</h1>

    <img id="bombilla" src="Bombilla.gif" width="200">

    <br><br>

    <button onclick="encenderBombilla()">Encender</button>

    <button onclick="apagarBombilla()">Apagar</button>

    <script>
       
        function encenderBombilla() {

            let imagen = document.getElementById("bombilla");

            imagen.src = "Bombilla2.gif";

        }

        function apagarBombilla() {

            let imagen = document.getElementById("bombilla");

            imagen.src = "Bombilla.gif";

        }

    </script>

</body>
</html>
